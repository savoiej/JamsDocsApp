const GUIDE=[
 {id:'start',g:'Getting started',t:'Welcome to Netline',who:'all',intro:'Netline documents one organization’s whole network: every site, room, rack, device, port, cable, jack, subnet and circuit. When the work is done it produces a numbered document set and PDF report you can hand to the client.',steps:['Pick a network from the Network menu at the top of the sidebar, or choose New network.','Use the sidebar to move between sections. They are grouped as Physical (what you can touch), Logical (how traffic flows), Service desk (ongoing support) and Deliver (what you hand over).','Overview shows how complete the documentation is and what changed recently.','Every page has a Help button in its header that opens the matching part of this guide.'],tips:['New to Netline? Choose “Load example network” on the welcome screen to explore a fully documented example before starting your own.']},
 {id:'quick',g:'Getting started',t:'Quick start: document a new network',who:'staff',intro:'The fastest path from an empty network to a finished report.',steps:['Choose Network → New network. Enter the client name and network name, and your company details for the report cover.','Add each site under Sites & rooms, then add the equipment rooms (MDF, IDF, closets) inside it.','Add devices under Devices, or paste switch output into Import from switches to create them for you.','Place devices in racks under Rack elevations, then record cables port to port under Cabling.','Add subnets and VLANs under IP & VLANs, and carrier circuits under WAN circuits.','Open Audit and fix the red items. Each one names exactly what is missing.','Open Document set and download the full report, or issue a revision to freeze what you handed over.'],tips:['You can work in any order. Audit always shows what is still missing.']},
 {id:'networks',g:'Getting started',t:'Networks, saving and sharing',who:'staff',intro:'Each network is a separate client or organization. Everything you enter is saved as you go.',steps:['Switch networks from the Network menu. Choose Network details on Overview to edit the name, client, address and billing settings.','The status line at the bottom of the sidebar shows whether changes are saved to the shared workspace or only to this browser.','Team members you share Netline with see the same networks. People with view-only access can read but not change anything.'],tips:['If you see “Saved in this browser only”, export a backup from Document set before clearing your browser.']},
 {id:'sites',g:'Physical',t:'Sites & rooms',who:'staff',views:['sites'],intro:'Sites are buildings or locations. Rooms are the equipment rooms inside them, and racks live in rooms.',steps:['Open Sites & rooms and choose Add site. Give it a short code (for example HNL1); the code is used in device and label names.','Select the site and add each room: MDF, IDF, closet or other.','Add racks to a room with their height in rack units.'],tips:['Short, consistent site codes make labels and cable IDs easier to read in the field.']},
 {id:'plans',g:'Physical',t:'Floor plans',who:'all',mod:'plans',views:['plans'],intro:'Upload a floor plan image or PDF page and pin jacks, access points, cameras and other equipment where they really are.',steps:['Open Floor plans and choose Add plan. Pick the site and floor, then upload the plan image.','Choose an item from the list and click on the plan to pin it. Drag a pin to move it.','Click any pin to see what it connects to and its full path back to the internet.','To change many at once, choose Select items. Click marks, drag a box around several, or tick them in the list, then choose Remove from plan (keeps the records) or Delete (removes the records for good). Shift-click a mark to start selecting at any time.'],tips:['Clients can view floor plans in the portal, which helps them describe where a problem is.']},
 {id:'devices',g:'Physical',t:'Devices and ports',who:'staff',views:['devices'],intro:'Every piece of network equipment: firewalls, routers, switches, access points, servers, patch panels and more.',steps:['Choose Add device. Enter the name, role, make and model, site and room, management IP and serial number.','Open a device to fill in its ports: description, VLAN, speed and what is connected.','The device panel shows photos, power source, connected cables and its path to the internet.'],tips:['Patch panels are devices too. Add them so cables can be traced through them.']},
 {id:'racks',g:'Physical',t:'Rack elevations',who:'staff',views:['racks'],intro:'A front view of every rack, unit by unit.',steps:['Open Rack elevations and pick a room.','Click an empty unit to place a device there.','To move a device, open it and change its rack and starting unit.'],tips:[]},
 {id:'power',g:'Physical',t:'Power mapping',who:'staff',mod:'power',views:['power'],intro:'Which UPS or PDU outlet each device is plugged into, how loaded each UPS is, and what goes dark if one fails.',steps:['Add UPS units and PDUs as devices, with their capacity in watts.','On each device, choose its power feed (and a second feed for dual power supplies) and its draw in watts.','Open Power to see load bars for each UPS and the list of devices that lose power if a UPS fails.'],tips:['Devices without a recorded power source appear in Audit.']},
 {id:'cabling',g:'Physical',t:'Cabling',who:'staff',views:['cabling'],intro:'The cable schedule: every connection port to port, including patch panels in between.',steps:['Choose Add cable and pick the device and port at each end.','Enter the cable type, color, length and label.','Netline joins cables through patch panels so a path from a wall jack to the switch shows as one route.'],tips:['Print cable labels from Labels once the schedule is complete.']},
 {id:'jacks',g:'Physical',t:'Wall jacks & patch paths',who:'staff',mod:'jacks',views:['jacks'],intro:'Every wall, floor and ceiling jack: the patch panel port behind it, the switch port it is patched to, and what is plugged into it.',steps:['Choose Add jack. Enter the jack ID and room, then pick its patch panel port.','Pick the switch port it is patched to and the endpoint plugged into it, if any.','Select any jack to see its full path to the internet.'],tips:['Bulk-add jacks with a range (for example 101 to 148) to save time.']},
 {id:'lifecycle',g:'Physical',t:'Lifecycle & budget',who:'staff',mod:'lifecycle',views:['lifecycle'],intro:'How old each device is, when vendor support ends, and what replacing it will cost by year.',steps:['Enter the purchase date, warranty end, end-of-support date and replacement cost for each device. You can edit them directly in the table.','The budget chart groups replacement costs by year so the client can plan ahead.'],tips:['Lifecycle appears in the report as its own section.']},
 {id:'discover',g:'Physical',t:'Import from switches',who:'staff',mod:'discover',views:['discover'],intro:'Paste command output from a switch and Netline builds devices, ports, VLANs and neighbors for you.',steps:['On the switch, run the commands listed on the Import page (neighbors, interface status, MAC table, VLANs) and copy the output.','Paste it into Import from switches and choose the switch it came from.','Review the list of proposed changes and approve the ones you want.'],tips:['Nothing changes until you approve it, so it is safe to paste and look.']},
 {id:'inventory',g:'Physical',t:'Site inventory',who:'staff',mod:'inventory',views:['inventory'],intro:'Every physical asset at each site: the network equipment from Devices plus workstations, laptops, printers, phones and other endpoints.',steps:['Choose Add item, or import a CSV of assets.','Record who has it, where it sits, its serial number and its asset tag.','Link an item to the jack it is plugged into so it shows up on floor plans and paths.'],tips:[]},
 {id:'topology',g:'Logical',t:'Topology',who:'staff',views:['topology'],intro:'A drawing of the physical links between network devices, built automatically from your cabling.',steps:['Open Topology. Devices and links appear from what you entered under Devices and Cabling.','Drag devices to arrange the drawing. The layout is saved.','Use the layer buttons to show or hide endpoints and other layers.'],tips:[]},
 {id:'ipam',g:'Logical',t:'IP & VLANs',who:'staff',views:['ipam'],intro:'Subnets with live utilization, the VLAN plan, and every documented address.',steps:['Add each VLAN with its ID, name and purpose.','Add subnets with their gateway and DHCP range, and link each to its VLAN.','Addresses on devices and inventory fill in subnet utilization automatically.'],tips:['Overlapping subnets and duplicate addresses appear in Audit.']},
 {id:'circuits',g:'Logical',t:'WAN circuits',who:'staff',views:['circuits'],intro:'Every carrier circuit, where it lands, and who to call when it drops.',steps:['Choose Add circuit. Enter the carrier, circuit ID, speed, account number and support phone.','Pick the device and port where it lands.'],tips:['Runbooks can pull the carrier support number straight from here.']},
 {id:'wireless',g:'Logical',t:'Wireless',who:'staff',views:['wireless'],intro:'SSIDs, the VLANs they bridge to, and where access points are mounted.',steps:['Add each SSID with its security type and VLAN.','Access points are devices. Pin them on floor plans to show coverage.'],tips:['Record where the Wi-Fi password is kept, not the password itself.']},
 {id:'security',g:'Logical',t:'Firewall, VPN, DNS & cloud',who:'staff',mod:'security',views:['security','dnscloud'],intro:'Firewall policies, port forwards and VPN tunnels, plus the DNS records and cloud services the business depends on.',steps:['Under Firewall & VPN, add policies (allow or deny, source, destination, service, reason), port forwards and site-to-site or remote-access VPN tunnels.','Under DNS & cloud, add the domain’s DNS records and each cloud or SaaS account with its owner and renewal date.'],tips:['Never type passwords or keys into Netline. Record where they are kept, such as the client’s password manager.']},
 {id:'tickets',g:'Service desk',t:'Tickets and board',who:'staff',mod:'servicedesk',views:['tickets','board'],intro:'Problems and requests for this network, tied to the site, device or inventory item involved, so every fix adds to its service history.',steps:['Choose New ticket. Pick the site and the device or item involved, the priority and a description.','Add notes as you work. Log time from the ticket if you bill for it.','Resolve the ticket with what fixed it. The fix appears in the device’s history.','Board shows the same tickets as cards. Drag a card to change its status.'],tips:['Service requests sent from the client portal arrive in the inbox on Tickets.']},
 {id:'billing',g:'Service desk',t:'Time & billing',who:'staff',mod:'billing',views:['billing'],intro:'Time logged on tickets, what has not been billed yet, and invoices ready to send.',steps:['Set the hourly rate, rounding increment, payment terms and bill-to address in Network details → Billing.','Start a timer or log time on any ticket.','Open Time & billing and choose New invoice. Pick the period and how to bill: a PDF invoice from Netline, or a billing file for the Jams Docs and Designs app.','For a billing file, open Jams Docs and Designs → Clients → Invoices → Import from Netline and pick the file.'],tips:['Download unbilled time as a CSV at any time.']},
 {id:'maint',g:'Service desk',t:'Maintenance',who:'staff',mod:'lifecycle',views:['maint'],intro:'Recurring work that keeps the network healthy: firmware reviews, UPS battery tests, backup checks, license renewals.',steps:['Choose Add task. Pick how often it repeats and the device or site it covers.','When a task comes due, open a work order. It becomes a ticket.','Resolving the ticket completes the task and schedules the next one.'],tips:[]},

 {id:'contacts',g:'Service desk',t:'Contacts & runbooks',who:'staff',mod:'runbooks',views:['contacts','runbooks'],intro:'Who to call, in order, and step-by-step procedures for this network.',steps:['Under Contacts, add the client’s people, vendors and carriers with their role and escalation order.','Under Runbooks, write procedures as numbered steps, or have Netline draft the internet outage runbook from your circuits and contacts.'],tips:['Runbooks are included in the report so the client has them on paper.']},

 {id:'docset',g:'Deliver',t:'Document set & PDF report',who:'all',views:['docset','labels'],intro:'The numbered document set: cover, table of contents, and one section per area of the network.',steps:['Open Document set to see every section and how complete it is.','Download one section, or the full report as a single PDF.','Export a backup file of the whole network from the same page.'],tips:['Sections for modules not in your plan are left out of the report.']},

   if(LOGO){try{doc.addImage(LOGO,'PNG',m,y,48,48,'logo','FAST')}catch(e){}}

const ADMK='netline:admin';
function admLoad(){
  if(S.mode==='db'||DB){
    const plansC=DB.collection('admin/cfg/plans'),acC=DB.collection('admin/cfg/accounts');
    plansC.onSnapshot(sn=>{if(sn.docs.length){S.admin.plans=new Map(sn.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.admin.saved=true}scheduleRender()},()=>{});
    acC.onSnapshot(sn=>{S.admin.accounts=new Map(sn.docs.map(d=>[d.id,{id:d.id,...d.data()}]));scheduleRender()},()=>{});return}
  const st=lsGet(ADMK);if(st){if(st.plans?.length){S.admin.plans=new Map(st.plans.map(p=>[p.id,p]));S.admin.saved=true}S.admin.accounts=new Map((st.accounts||[]).map(a=>[a.id,a]))}}

  if(DB){try{await DB.doc(`admin/cfg/${kind}/${o.id}`).set(strip(o))}catch(e){dbErr(e);toast('Could not save that change.')}}else admLocalSave()}

const psrcOf=id=>all('psrc').find(x=>x.deviceId===id);
const feedsOf=id=>all('power').filter(f=>f.deviceId===id);
const feedsFrom=id=>all('power').filter(f=>f.srcId===id).sort((a,b)=>String(a.outlet||'').localeCompare(String(b.outlet||''),undefined,{numeric:true}));
function pwrLoad(id,seen=new Set()){if(seen.has(id))return 0;seen.add(id);let w=0;for(const f of feedsFrom(id)){const d=get('devices',f.deviceId);w+=d?.role==='UPS / PDU'?pwrLoad(d.id,seen):(+f.watts||0)}return w}
function pwrPct(id){const c=+psrcOf(id)?.capW||0;return c?Math.round(pwrLoad(id)/c*100):0}
function pwrImpact(id){const failed=new Set([id]);let ch=true;const down=new Set();
  while(ch){ch=false;for(const d of all('devices')){if(failed.has(d.id)||down.has(d.id))continue;const F=feedsOf(d.id);if(F.length&&F.every(f=>f.srcId&&failed.has(f.srcId))){if(d.role==='UPS / PDU')failed.add(d.id);else down.add(d.id);ch=true}}}
  return [...down].map(x=>get('devices',x)).filter(Boolean).sort(by('hostname'))}
function onUps(d,seen=new Set()){if(seen.has(d.id))return false;seen.add(d.id);return feedsOf(d.id).some(f=>{const s2=get('devices',f.srcId);if(!s2)return false;if(/^UPS/.test(psrcOf(s2.id)?.kind||'UPS'))return true;return onUps(s2,seen)})}
const PWR_CRIT=['Firewall','Router','Core switch','Distribution switch','Server','Hypervisor','Storage','Wireless controller'];
const needsPwr=d=>{const r=ROLES[d.role]||{};return r.racked&&!r.passive&&d.role!=='UPS / PDU'&&d.role!=='Patch panel'&&d.status!=='Retired'};
function battAge(p){if(!p?.battery)return null;const t=Date.parse(p.battery);return isNaN(t)?null:(Date.now()-t)/(365.25*864e5)}
function feedText(f){const s2=get('devices',f.srcId);return s2?`${s2.hostname}${f.outlet?' · '+f.outlet:''}`:(f.circuit?'Wall · '+f.circuit:'Wall outlet')}
function powerSectionHTML(d){const F=feedsOf(d.id);let h=`<p class="secthd"><span>Power${F.length?' · '+F.length+' feed'+(F.length>1?'s':''):''}</span>${W()?`<button type="button" class="btn sm" data-act="addFeed" data-id="${d.id}">Add feed</button>`:''}</p>`;

    ${L.length?`<ul class="feeds">${L.map(f=>{const x=get('devices',f.deviceId);return `<li><span><span class="o">${esc(f.outlet||'—')}</span> <button class="lnk" data-act="gotoDevice" data-id="${f.deviceId}">${esc(x?.hostname||'?')}</button> <span class="muted">${esc(f.feed||'')}</span></span><span class="mono muted">${f.watts?esc(f.watts)+' W':''}</span></li>`}).join('')}</ul>`:''}
    ${imp.length?`<p class="note"><b>If this fails:</b> ${imp.map(x=>esc(x.hostname)).join(', ')} lose power.</p>`:''}`}

  ${SRC.length?`<div class="pgrid">${SRC.map(d=>{const p=psrcOf(d.id);const L=feedsFrom(d.id);const ba=battAge(p);const imp=pwrImpact(d.id);const up=feedsOf(d.id);
    return `<div class="panel psrc"><div class="ph"><div><p class="eyebrow">${esc(p?.kind||'UPS / PDU')} · ${esc(locText(d)||'')}</p><h2><button class="lnk" data-act="gotoDevice" data-id="${d.id}" style="font:inherit">${esc(d.hostname)}</button></h2></div><div class="actions">${W()?`<button class="btn sm" data-act="psrcEdit" data-id="${d.id}">${p?'Details':'Add capacity'}</button>`:''}</div></div>

const e2=v=>esc(v||'')||'<span class="muted">—</span>';

function outageSteps(site){const fws=all('devices').filter(d=>d.siteId===site.id&&d.role==='Firewall').sort(by('hostname'));const isps=all('devices').filter(d=>d.siteId===site.id&&d.role==='ISP / Modem');const C=all('circuits').filter(c=>c.siteId===site.id);
  const ppl=all('contacts').filter(c=>(c.siteId===site.id||!c.siteId)&&!['ISP or carrier','Vendor support'].includes(c.role)).sort((a,b)=>(+a.escalation||99)-(+b.escalation||99)).slice(0,3);const st=[];
  st.push(`Confirm the scope: try a wired computer and Wi-Fi. If only one area is down, check that area's switch instead.`);
  for(const f of fws)st.push(`Check the firewall ${f.hostname}${f.mgmtIp?' ('+f.mgmtIp+')':''} in ${locText(f)||'the equipment room'}: power on, WAN port lights on. Log in and check the WAN status.`);
  for(const d of isps){const c=C.find(x=>x.deviceId===d.id);st.push(`Power-cycle the ${c?.provider||'carrier'} device ${d.hostname} in ${locText(d)||'the equipment room'}. Unplug for 30 seconds, then wait 3 minutes for it to come up.`)}
  for(const c of C)st.push(`Still down on ${c.provider}? Call ${c.support||'the carrier'}${c.circuitId?' with circuit ID '+c.circuitId:''}${c.account?' and account '+c.account:''}. Ask for a ticket number.`);
  if(C.length>1)st.push(`Confirm the firewall failed over to ${C.slice(1).map(c=>c.provider).join(' or ')} and that phones and the EHR work on the backup link.`);
  if(ppl.length)st.push(`Tell ${ppl.map(p=>p.name+(p.phone?' ('+p.phone+')':'')).join(', ')} what is happening and the carrier's estimate.`);
  st.push(`Log what you found and the carrier ticket number in a Netline ticket for this site. When service is back, confirm the firewall is on the primary link.`);return st}

function addInt(iso,n,u){const d=new Date((iso||todayL())+'T12:00:00');n=+n||1;if(u==='days')d.setDate(d.getDate()+n);else if(u==='weeks')d.setDate(d.getDate()+7*n);else if(u==='years')d.setFullYear(d.getFullYear()+n);else d.setMonth(d.getMonth()+n);return isoD(d)}

const LIFE={'Core switch':8,'Distribution switch':7,'Access switch':7,'Router':7,'Firewall':5,'Wireless controller':6,'Access point':5,'Server':5,'Hypervisor':5,'Storage':5,'UPS / PDU':6,'Camera':6,'Phone':6,'Printer':5,'Workstation':5,'IoT / Other':5,'Laptop':4,'Thin client':6,'Monitor':6,'Printer / MFP':5,'Tablet':4,'POS terminal':6,'TV / display':6,'Badge reader':8,'Medical device':8,'Peripheral':4,'Other':5};

function lcCalc(x){const o=x.o;const life=+o.lifeYears||LIFE[x.kind]||5;const p=o.purchased&&!isNaN(new Date(o.purchased))?o.purchased:'';const byLife=p?addInt(p,life,'years'):'';const eosl=o.eosl&&!isNaN(new Date(o.eosl))?o.eosl:'';
  const by=[byLife,eosl].filter(Boolean).sort()[0]||'';const age=p?Math.max(0,(Date.now()-new Date(p+'T12:00:00'))/3.15576e10):null;const d=daysTo(by);
  return{life,by,why:by?(by===eosl?'end of support':'age'):'',age,cost:+o.replaceCost||0,st:!by?{k:'',t:'Needs a date'}:d<0?{k:'bad',t:'Replace now'}:d<=365?{k:'warn',t:'Within 12 months'}:d<=3*365?{k:'acc',t:'Plan for it'}:{k:'ok',t:'OK'}}}
function lcForecast(L){const y0=new Date().getFullYear();const B=[{lab:'Overdue',over:true,n:0,c:0,m:0},...[0,1,2,3,4].map(i=>({lab:String(y0+i),n:0,c:0,m:0}))];
  for(const x of L){const c=lcCalc(x);if(!c.by)continue;const y=+c.by.slice(0,4);const b=daysTo(c.by)<0?B[0]:B.find(b=>b.lab===String(y));if(!b)continue;b.n++;if(c.cost)b.c+=c.cost;else b.m++}return B}

function shrinkImg(img){for(const [mx,q] of [[2000,.8],[1600,.72],[1300,.65],[1000,.55]]){const k=Math.min(1,mx/Math.max(img.naturalWidth||1000,img.naturalHeight||700));const c=document.createElement('canvas');c.width=Math.round((img.naturalWidth||1000)*k);c.height=Math.round((img.naturalHeight||700)*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',q);if(u.length<230000)return u}
  throw new Error('That image is too detailed to store here. Try a smaller export.')}
async function savePlan(f){const p=S.dlg.obj;const isNew=!p.id;for(const k of ['name','siteId','floor','notes'])p[k]=f.elements[k].value.trim();p.widthM=f.elements.widthM.value?+f.elements.widthM.value:'';
  const file=$('#pf_file').files[0];if(!p.name){toast('Name the floor plan.');return}if(isNew&&!file){toast('Choose a floor plan image.');return}
  if(file){toast('Saving the floor plan image…');try{const img=await loadImg(file);p.w=img.w;p.h=img.h;
      if(ASSETS){const r=await ASSETS.upload(file);p.imageId=r.id;delete p.imageData}else{p.imageData=shrinkImg(img.el);delete p.imageId}}
    catch(e){toast(e?.code==='too_large'?'That image is over 20 MB. Export a smaller one.':e?.code==='unsupported_type'?'Use a PNG, JPG or SVG image.':(e?.message||'Could not save the image.'));return}}
  await put('plans',p,{log:`${isNew?'Added':'Updated'} floor plan ${p.name}`});S.ui.planId=p.id;S.pcam=null;closeDialog();toast(isNew?'Floor plan added. Pick an item, then click its spot.':'Saved');if(S.view!=='plans')go('plans');else render()}
async function deletePlan(id){const p=get('plans',id);if(!p)return;const list=planItems(id).map(({t,o})=>{const c=structuredClone(o);delete c.pos;return [t,c]});if(list.length)await putMany(list);
  if(p.imageId&&ASSETS){try{await ASSETS.delete(p.imageId)}catch(e){}}await del('plans',id,{log:'Deleted floor plan '+p.name});closeDialog();S.ui.planId='';toast('Deleted '+p.name)}
/* floor plan image with numbered marks, for the PDF */
function planPNG(p,items){return new Promise(res=>{const src=planSrc(p);const w=p.w||1000,h=p.h||700;const k=Math.min(3,2600/Math.max(w,h));const W2=Math.round(w*k),H2=Math.round(h*k);
  const draw=img=>{try{const c=document.createElement('canvas');c.width=W2;c.height=H2;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W2,H2);if(img)g.drawImage(img,0,0,W2,H2);
    const r=Math.max(11,Math.max(W2,H2)/95);
    if(p.widthM){const cr=10/p.widthM*W2;g.setLineDash([r*.6,r*.4]);for(const {t,o} of items)if(pinKind(t,o)==='ap'){g.beginPath();g.arc(o.pos.x*W2,o.pos.y*H2,cr,0,7);g.fillStyle='rgba(133,86,196,.08)';g.fill();g.strokeStyle='rgba(133,86,196,.5)';g.lineWidth=r/6;g.stroke()}g.setLineDash([])}
    items.forEach(({t,o},i)=>{const x=o.pos.x*W2,y=o.pos.y*H2;const P=PINK[pinKind(t,o)];g.fillStyle=P.hex;g.strokeStyle='#fff';g.lineWidth=r/4;g.beginPath();
      if(P.shape==='sq'){const a=r*.95;g.rect(x-a,y-a,2*a,2*a)}else g.arc(x,y,r,0,7);g.fill();g.stroke();
      g.fillStyle='#fff';g.font=`700 ${Math.round(r*(i>=99?.8:1))}px Helvetica,Arial,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(i+1),x,y+r*.05)});
    res({url:c.toDataURL('image/png'),w:W2,h:H2})}catch(e){res(null)}};
  if(!src){draw(null);return}const img=new Image();img.onload=()=>draw(img);img.onerror=()=>draw(null);img.src=src})}

const portNum=n=>{const m=String(n).match(/(\d+)$/);return m?+m[1]:null};
const backWired=(pn,port)=>cablesAt(pn.id,port).some(c=>{const fd=get('devices',far(c,pn.id,port)?.dev);const r=ROLES[fd?.role]||{};return isJack(fd)||r.passive||(r.tier??6)>=5});
function jkPortOpts(pn,which){const ps=pn.ports||[];const free=ps.map((p,i)=>[p,i]).filter(([p])=>!backWired(pn,p.n));const pick=which==='first'?(free[0]?.[1]??0):(free[free.length-1]?.[1]??ps.length-1);

function jackFields(pn){const panels=all('devices').filter(d=>d.role==='Patch panel').sort(by('hostname'));const cat=/6a/i.test(pn.model||'')?'Cat6A':/om4|lc|fiber/i.test(pn.model||'')?'OM4':'Cat6';

function jkPlan(){const f=$('#jackForm');if(!f)return null;const pn=get('devices',f.elements.panel.value);if(!pn)return null;const ps=pn.ports||[];let a=+f.elements.from.value,b=+f.elements.to.value;if(a>b)[a,b]=[b,a];

    if(backWired(pn,p.n))skip.push(p.n+' (already wired)');else if(names.has(name.toLowerCase()))skip.push(p.n+' ('+name+' exists)');else{make.push({port:p.n,name});names.add(name.toLowerCase())}}

function subnetUse(s){const c=cidr(s.cidr);if(!c)return{c,used:0,set:[]};const set=new Map();for(const a of addressBook())if(inC(c,a.addr)){if(!set.has(a.addr))set.set(a.addr,a)}return{c,used:set.size,set:[...set.values()].sort((x,y)=>ip2n(x.addr)-ip2n(y.addr))}}

     <td><div class="meter" title="${u.used} of ${u.c?.usable||0}"><i class="${pc>90?'bad':pc>75?'warn':''}" style="width:${Math.max(pc,u.used?2:0)}%"></i></div><span class="muted mono" style="font-size:11px">${u.used} / ${u.c?.usable??'—'}</span></td></tr>`}).join('')}</tbody></table></div>`

function nextFree(s){const u=subnetUse(s);if(!u.c)return null;const used=new Set(u.set.map(a=>ip2n(a.addr)));for(let n=u.c.first;n<=u.c.last;n++)if(!used.has(n))return n2ip(n);return null}

  return `<div class="ph"><div><p class="eyebrow">${esc(s.name||'Subnet')}${s.vid?' · VLAN '+esc(s.vid):''}</p><h2 class="mono" style="font-family:var(--f-mono);font-size:18px">${esc(s.cidr)}</h2></div><div class="actions">${W()?`<button class="btn sm" data-act="edit" data-type="subnets" data-id="${s.id}">Edit</button>`:''}</div></div>
  <div class="pb">${u.c?`<dl class="kv"><dt>Range</dt><dd class="mono">${n2ip(u.c.first)} – ${n2ip(u.c.last)}</dd><dt>Mask</dt><dd class="mono">${n2ip((0xffffffff<<(32-u.c.bits))>>>0)} (/${u.c.bits})</dd><dt>Broadcast</dt><dd class="mono">${n2ip(u.c.net+u.c.size-1)}</dd><dt>Usable</dt><dd>${u.c.usable} · ${u.used} documented</dd><dt>DHCP</dt><dd>${esc(s.dhcp)||'—'}</dd>${s.notes?`<dt>Notes</dt><dd>${esc(s.notes)}</dd>`:''}</dl>`:'<p class="note">This CIDR is not valid. Edit it to a form like 10.10.20.0/24.</p>'}
   ${nf&&W()?`<div class="actions"><button class="btn sm primary" data-act="add" data-type="ips" data-pre='{"addr":"${nf}"}'>Assign next free · ${nf}</button></div>`:''}

    sel.innerHTML=`<option value="">— port —</option>`+(d?.ports||[]).map(p=>{const used=cablesAt(d.id,p.n).filter(x=>x.id!==c.id).length;const lim=isPanel(d)?2:1;return `<option value="${esc(p.n)}"${used>=lim?' disabled':''}>${esc(p.n)}${p.desc?' · '+esc(p.desc):''}${used?(isPanel(d)?' · one side used':' · in use'):''}</option>`}).join('');
    const fp=freePort(t.value);if(fp)sel.value=fp;return}
  if(t.id==='csvFile'&&t.files[0]){const txt=await t.files[0].text();$('#csvText').value=txt;const r=csvToDevices(txt);$('#csvPrev').textContent=r.err||`${r.list.length} devices ready to import (${r.list.filter(d=>d.id).length} update existing).`;return}
  if(t.id==='acsvFile'&&t.files[0]){const txt=await t.files[0].text();$('#acsvText').value=txt;const r=csvToAssets(txt);$('#acsvPrev').textContent=r.err||`${r.list.length} items ready to import (${r.list.filter(a=>a.id).length} update existing).`;return}
  if(t.id==='jsonFile'&&t.files[0]){await restoreJSON(await t.files[0].text());return}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='jackForm'){await createJacks();return}
  if(f.id==='timeForm'){await logTime(f);return}
  if(f.id==='acctForm'){await saveAcct(f);return}
  if(f.id==='invForm'){await createInvoice();return}
  if(f.id==='planForm'){await savePlan(f);return}
  if(f.id==='revForm'){await issueRevision();return}
  if(f.id==='reqForm'){await sendRequest(f);return}
  if(f.id==='maintForm'){await saveMaint(f);return}
  if(f.id==='mdoneForm'){const m=await completeMaint(f.dataset.id,{date:$('#md_date').value||todayL(),note:$('#md_note').value.trim()});closeDialog();if(m)toast('Done. Next due '+m.next);return}
  if(f.id==='edForm'){const {type,obj}=S.dlg;readForm(f,obj,SCHEMA[type].fields);const isNew=!obj.id;
    if(obj.id&&(type==='assets'||type==='tickets')){const cur=get(type,obj.id);if(cur?.photos)obj.photos=cur.photos;if(cur?.pos)obj.pos=cur.pos}
    if(type==='assets'&&f.elements.linkDev){const ld=f.elements.linkDev.value;if(ld)obj.link={dev:ld,port:f.elements.linkPort.value};else delete obj.link}
    if(type==='subnets'&&!cidr(obj.cidr)){toast(obj.cidr+' is not a valid CIDR, e.g. 10.10.20.0/24.');return}
    if(type==='tickets'){const old=get('tickets',obj.id);obj.log=old?.log?structuredClone(old.log):(obj.log||[]);if(!obj.siteId)obj.siteId=get('devices',obj.deviceId)?.siteId||get('assets',obj.assetId)?.siteId||'';
      if(isNew){obj.num=nextNum();obj.created=Date.now();if(S.uid)obj.createdBy=S.uid;obj.log.push({ts:obj.created,by:S.uid||'',kind:'status',text:'Opened as '+(obj.priority||'Normal')+' priority'})}
      else if(old&&old.status!==obj.status){obj.log.push({ts:Date.now(),by:S.uid||'',kind:'status',text:`Status: ${old.status} → ${obj.status}`});if(!tOpen(obj)&&!obj.resolvedAt)obj.resolvedAt=Date.now();if(tOpen(obj))delete obj.resolvedAt}
      await put('tickets',obj,{log:`${isNew?'Opened':'Updated'} ${tNo(obj)} ${obj.title}`});S.sel.tickets=obj.id;closeDialog();toast((isNew?'Opened ':'Saved ')+tNo(obj));if(isNew&&S.view!=='tickets'&&S.view!=='board')go('tickets');return}
    if(type==='assets'&&obj.ip&&ip2n(obj.ip)==null){toast(obj.ip+' is not a valid IPv4 address.');return}
    if(type==='ips'&&ip2n(obj.addr)==null){toast(obj.addr+' is not a valid IPv4 address.');return}
    if(type==='vlans'&&(obj.vid<1||obj.vid>4094)){toast('VLAN IDs run from 1 to 4094.');return}
    if(type==='vlans'&&all('vlans').some(v=>+v.vid===+obj.vid&&v.id!==obj.id&&(v.siteId||'')===(obj.siteId||''))){toast('VLAN '+obj.vid+' is already in the plan.');return}
    const name=obj.name||obj.ssid||obj.cidr||obj.addr||obj.provider||'';
    await put(type,obj,{log:`${isNew?'Added':'Updated'} ${SCHEMA[type].label} ${name}`});if(type==='subnets')S.sel.subnets=obj.id;closeDialog();toast((isNew?'Added ':'Saved ')+name)}
  else if(f.id==='tkNoteForm'||f.id==='tkResForm'){const isRes=f.id==='tkResForm';const txt=(isRes?S.ui.tkRes:S.ui.tkNote).trim();if(!txt){toast(isRes?'Describe what fixed it first.':'Write a note first.');return}
    const t=structuredClone(get('tickets',f.dataset.id));t.log=t.log||[];
    if(isRes){t.resolution=txt;const old=t.status;t.status='Resolved';t.resolvedAt=Date.now();t.log.push({ts:Date.now(),by:S.uid||'',kind:'res',text:'Resolved: '+txt});S.ui.tkRes='';await put('tickets',t,{log:`Resolved ${tNo(t)} ${t.title}`});toast('Resolved '+tNo(t))}
    else{t.log.push({ts:Date.now(),by:S.uid||'',kind:'note',text:txt});if(t.status==='New'){t.status='Open';t.log.push({ts:Date.now(),by:S.uid||'',kind:'status',text:'Status: New → Open'})}S.ui.tkNote='';await put('tickets',t);toast('Note added')}}
  else if(f.id==='devForm')await saveDevice(f);
  else if(f.id==='cabForm')await saveCable(f);
  else if(f.id==='projForm')await saveProject(f);
  else if(f.id==='portForm'){const d=structuredClone(get('devices',f.dataset.dev));const p=d.ports.find(x=>x.n===f.dataset.port);for(const k of ['desc','mode','vlan','vlans','ip'])p[k]=f.elements[k].value.trim();
    if(p.ip&&ip2n(p.ip.split('/')[0])==null){toast(p.ip+' is not a valid address.');return}await put('devices',d,{log:`Updated ${d.hostname} ${p.n}`});toast('Saved '+p.n)}});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-tk]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.tk);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',e=>{document.querySelectorAll('.kcard.dragging,.kcol.over').forEach(n=>n.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('.kcol');if(!col)return;e.preventDefault();document.querySelectorAll('.kcol.over').forEach(n=>n!==col&&n.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',async e=>{const col=e.target.closest?.('.kcol');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id&&W()){const t=get('tickets',id);if(t&&t.status!==col.dataset.col){await tkStatus(id,col.dataset.col);toast(tNo(t)+' → '+col.dataset.col)}}});
document.addEventListener('keydown',e=>{if(S.view==='plans'&&S.psel&&$('#overlay').hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){if(e.key==='Escape'){S.psel=null;render();return}if((e.key==='Delete'||e.key==='Backspace')&&S.psel.size){e.preventDefault();pselDeleteDialog();return}}if(e.key==='Escape'&&S.placing&&$('#overlay').hidden){S.placing=null;if(S.view==='plans'){planDraw();$('#planInsp').innerHTML=planSide(get('plans',S.ui.planId))}}if(e.key==='Escape'&&!$('#overlay').hidden)closeDialog();if(e.key==='Escape'&&S.topoSrc){S.topoSrc=null;if(S.view==='topology'){topoDraw();applyCam()}}});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDialog()});
window.addEventListener('resize',()=>{if(S.view==='topology')applyCam();if(S.view==='plans'){S.pcam=null;planFit()}});
var SCAN=parseScan(EMB?('#'+(EMB.hash||'')):location.hash);if(SCAN)S.field={t:SCAN.t,id:SCAN.id};
window.NL_SCAN=h=>{const sc=parseScan(h);if(!sc)return;if(sc.pid!==S.pid&&S.projects.has(sc.pid))openProject(sc.pid);S.field={t:sc.t,id:sc.id};closeDialog();go('field')};
window.addEventListener('hashchange',()=>{const sc=parseScan(location.hash);if(!sc)return;if(sc.pid!==S.pid&&S.projects.has(sc.pid))openProject(sc.pid);S.field={t:sc.t,id:sc.id};closeDialog();go('field')});
{const h=EMB?(EMB.hash||''):location.hash.slice(1);go(SCAN?'field':VIEWS[h]?h:'overview')}boot();
</script>
